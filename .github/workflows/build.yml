name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          Copy-Item (Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName ffmpeg.exe

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --windowed --name VideoTranslator --collect-all customtkinter --collect-all sherpa_onnx main.py

      - name: Copy FFmpeg next to exe
        run: Copy-Item ffmpeg.exe dist\VideoTranslator\ffmpeg.exe

      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Zip portable build
        run: Compress-Archive -Path dist\VideoTranslator\* -DestinationPath VideoTranslator-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: VideoTranslator
          path: |
            VideoTranslator-portable.zip
            installer_out/VideoTranslator-Setup.exe

      - name: Publish release (khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VideoTranslator-portable.zip
            installer_out/VideoTranslator-Setup.exe
